<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard - Image Manager</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="navbar">
    <h2>Image Manager — <span id="user-name"></span></h2>
    <button id="logout-btn" class="btn-secondary">Logout</button>
  </div>

  <div class="container">
    <div class="upload-panel">
      <div id="upload-alert" class="alert"></div>
      <div class="upload-row">
        <input type="file" id="image-input" accept="image/jpeg,image/png,image/webp" />
        <select id="provider-select">
          <option value="cloudinary">Cloudinary</option>
          <option value="imagekit">ImageKit</option>
          <option value="supabase">Supabase</option>
        </select>
        <button id="upload-btn" class="btn-primary">Upload</button>
      </div>
      <div class="preview-box">
        <img id="preview-img" alt="Preview" />
      </div>
    </div>

    <div id="empty-state" class="empty-state" style="display:none;">
      No images yet. Upload your first one above.
    </div>
    <div id="image-grid" class="image-grid"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/upload.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
