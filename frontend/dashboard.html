<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Image Manager</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script type="module" src="/js/speed-insights.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">
      <span class="brand-dot"></span>
      Image Manager
    </a>
    <div class="nav-actions">
      <span class="nav-user">Hi, <strong id="user-name">there</strong></span>
      <button id="logout-btn" class="btn-secondary">Logout</button>
    </div>
  </nav>

  <main class="container">
    <section class="upload-panel">
      <div>
        <div id="upload-alert" class="alert"></div>
        <div class="upload-row">
          <input type="file" id="image-input" accept="image/jpeg,image/png,image/webp" />
          <select id="provider-select">
            <option value="cloudinary">Cloudinary</option>
            <option value="imagekit">ImageKit</option>
            <option value="supabase">Supabase</option>
          </select>
          <button id="upload-btn" class="btn-primary">Upload</button>
        </div>
      </div>
      <div class="preview-box">
        <img id="preview-img" alt="Preview" />
      </div>
    </section>

    <div id="empty-state" class="empty-state" style="display:none;">
      No images yet. Be the first to upload one!
    </div>
    <div id="image-grid" class="masonry"></div>
  </main>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true">
    <div class="lightbox-close" id="lightbox-close">&times;</div>
    <img id="lightbox-img" alt="" />
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/upload.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
