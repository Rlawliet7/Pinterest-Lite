<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Image Manager</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <h1>Create account</h1>
      <p class="auth-sub">Join the gallery and start sharing.</p>
      <div id="alert" class="alert"></div>
      <form id="register-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" required minlength="2" autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn-primary">Register</button>
      </form>
      <div class="auth-switch">
        Already have an account? <a href="/login.html">Log in</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
